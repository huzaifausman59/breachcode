<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Dashboard — BreachCoach</title>
  <link rel="stylesheet" href="/css/main.css"/>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <div class="layout">
    <aside class="sidebar" id="sidebar" aria-label="Sidebar navigation"></aside>

    <div class="main">
      <header class="main-header">
        <div>
          <h1 class="page-title">Dashboard</h1>
          <p class="page-subtitle">Overview of all phishing training campaigns</p>
        </div>
        <div class="main-actions">
          <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Open menu" aria-expanded="false">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
          </button>
          <a href="/campaigns.html" class="btn btn-primary">
            <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" fill="white"/></svg>
            New Campaign
          </a>
        </div>
      </header>

      <main class="main-content" id="main-content">
        <!-- Stat rings -->
        <div class="stat-grid" id="stat-grid" aria-label="Campaign statistics">
          <div class="stat-card"><div class="spinner"></div></div>
        </div>

        <!-- Recent campaigns -->
        <div class="card">
          <div class="card-header">
            <h2 class="card-title">Recent Campaigns</h2>
            <a href="/campaigns.html" class="btn btn-secondary btn-sm">View all</a>
          </div>
          <div class="table-wrapper">
            <table aria-label="Recent campaigns">
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Phase</th>
                  <th>Status</th>
                  <th>Sent</th>
                  <th>Clicked</th>
                  <th>Submitted</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="campaign-tbody">
                <tr><td colspan="7"><div class="spinner" style="margin:16px auto"></div></td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/pages/dashboard.js"></script>
</body>
</html>
