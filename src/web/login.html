<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Sign In — BreachCoach</title>
  <link rel="stylesheet" href="/css/main.css"/>
  <style>body{display:block;}</style>
</head>
<body class="login-page">
  <main class="login-card" aria-label="Sign in to BreachCoach">
    <div class="login-logo">
      <div class="login-logo-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/></svg>
      </div>
      <span class="login-logo-name">BreachCoach</span>
    </div>

    <h1 class="login-title">Welcome back</h1>
    <p class="login-subtitle">Sign in to manage your phishing training campaigns.</p>

    <div id="login-error" class="alert alert-error hidden" role="alert"></div>

    <form id="login-form" novalidate>
      <div class="form-group">
        <label for="username">Username</label>
        <input id="username" name="username" type="text"
               autocomplete="username" required
               aria-required="true" aria-describedby="username-err"/>
        <p class="field-error hidden" id="username-err"></p>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" name="password" type="password"
               autocomplete="current-password" required
               aria-required="true" aria-describedby="password-err"/>
        <p class="field-error hidden" id="password-err"></p>
      </div>
      <button type="submit" class="btn btn-primary btn-lg w-full" style="justify-content:center;margin-top:8px">
        Sign in
      </button>
    </form>

    <p class="text-sm text-muted" style="margin-top:20px;text-align:center">
      Northwind University — Security Awareness Training
    </p>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/pages/login.js"></script>
</body>
</html>
